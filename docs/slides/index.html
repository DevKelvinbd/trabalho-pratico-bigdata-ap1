<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Apresentação de Slides Completa — Grupo 3 (AP1 Big Data)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #06090e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barra Superior de Controles */
    nav {
      height: 54px;
      background: #0d1117;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      color: #c9d1d9;
    }
    .nav-brand {
      font-weight: 700;
      font-size: 16px;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      background: #161b22;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background: #21262d;
      color: #f0f6fc;
    }
    .tab-btn.active {
      background: #1f6feb;
      border-color: #388bfd;
      color: #ffffff;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ctrl-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn:hover { background: #30363d; color: #fff; }
    .slide-counter { font-size: 13px; color: #8b949e; font-weight: 600; font-family: monospace; }

    /* Palco do Slide */
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06090e;
      position: relative;
      overflow: hidden;
    }

    /* Container com proporção travada em 16:9 (1920x1080) */
    .slide-frame {
      width: 1920px;
      height: 1080px;
      position: absolute;
      transform-origin: center center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #21262d;
    }
    iframe {
      width: 1920px;
      height: 1080px;
      border: none;
      pointer-events: auto;
    }

    /* Overlay de navegação invisível nas laterais para cliques rápidos */
    .arrow-click-zone {
      position: absolute;
      top: 54px;
      bottom: 0;
      width: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      cursor: pointer;
      z-index: 50;
      color: #fff;
      font-size: 32px;
      background: rgba(0,0,0,0.4);
    }
    .arrow-click-zone:hover { opacity: 1; }
    .arrow-left { left: 0; }
    .arrow-right { right: 0; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-brand">
      <span>🎬</span>
      <span>Slides AP1 Big Data • Grupo 3</span>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="goToSlide(0)">Capa</button>
      <button class="tab-btn" onclick="goToSlide(1)">1. Arquitetura (Kelvin)</button>
      <button class="tab-btn" onclick="goToSlide(2)">2. Gerador & Flume (Micaell)</button>
      <button class="tab-btn" onclick="goToSlide(3)">3. Flink & HBase (Ester/Kaike)</button>
      <button class="tab-btn" onclick="goToSlide(4)">4. Spark & Hive (Julio)</button>
      <button class="tab-btn" onclick="goToSlide(5)">5. Trade-offs (Kelvin)</button>
    </div>

    <div class="nav-actions">
      <span class="slide-counter" id="slide-num">1 / 6</span>
      <button class="ctrl-btn" onclick="prevSlide()">◀ Anterior</button>
      <button class="ctrl-btn" onclick="nextSlide()">Próximo ▶</button>
      <button class="ctrl-btn" onclick="toggleFullScreen()">⛶ Tela Cheia</button>
    </div>
  </nav>

  <div class="viewport" id="viewport">
    <div class="arrow-click-zone arrow-left" onclick="prevSlide()">❮</div>
    <div class="arrow-click-zone arrow-right" onclick="nextSlide()">❯</div>
    
    <div class="slide-frame" id="slide-frame">
      <iframe id="slide-frame-content" src="slide1_capa.html"></iframe>
    </div>
  </div>

  <script>
    const slides = [
      "slide1_capa.html",
      "slide2_bloco1.html",
      "slide3_bloco2.html",
      "slide4_bloco3.html",
      "slide5_bloco4.html",
      "slide6_bloco5.html"
    ];

    let currentIndex = 0;
    const iframe = document.getElementById("slide-frame-content");
    const frame = document.getElementById("slide-frame");
    const counter = document.getElementById("slide-num");
    const tabs = document.querySelectorAll(".tab-btn");

    function resizeFrame() {
      const vw = window.innerWidth;
      const vh = window.innerHeight - 54;
      const scaleX = (vw - 40) / 1920;
      const scaleY = (vh - 40) / 1080;
      const scale = Math.min(scaleX, scaleY);
      frame.style.transform = `scale(${scale})`;
    }

    window.addEventListener("resize", resizeFrame);
    resizeFrame();

    function goToSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentIndex = index;
      iframe.src = slides[currentIndex];
      counter.innerText = `${currentIndex + 1} / ${slides.length}`;
      tabs.forEach((tab, i) => {
        tab.classList.toggle("active", i === currentIndex);
      });
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        goToSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        goToSlide(currentIndex - 1);
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        prevSlide();
      } else if (e.key === "f" || e.key === "F") {
        toggleFullScreen();
      }
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>

</body>
</html>

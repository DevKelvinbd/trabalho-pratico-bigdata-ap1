# ==============================================================================
# Flume Agent Configuration: ecommerce_agent
# Trabalho Prático AP1 - Varejista Online (Big Data em Tempo Real)
# Grupo 3 (Kelvin, Micaell, Ester, Kaike, Julio)
#
# Arquitetura de Ingestão:
#   Source: TAILDIR monitorando /logs/ecommerce.log
#   Channels: c_hdfs (buffer HDFS) e c_flink (buffer Streaming)
#   Sinks:
#     1. sink_hdfs  -> Salva logs brutos particionados no HDFS (/raw/ecommerce/...)
#     2. sink_flink -> Envia stream de eventos via Avro/Socket para o Apache Flink
# ==============================================================================

# Definição dos nomes dos componentes
ecommerce_agent.sources = src_tail
ecommerce_agent.channels = c_hdfs c_flink
ecommerce_agent.sinks = sink_hdfs sink_flink

# ------------------------------------------------------------------------------
# 1. Configuração da Fonte (Source): TAILDIR
# Rastreia novas linhas adicionadas ao log e mantém posição persistente
# ------------------------------------------------------------------------------
ecommerce_agent.sources.src_tail.type = TAILDIR
ecommerce_agent.sources.src_tail.positionFile = /var/log/flume/taildir_position.json
ecommerce_agent.sources.src_tail.filegroups = f_ecommerce
ecommerce_agent.sources.src_tail.filegroups.f_ecommerce = /logs/ecommerce.log
ecommerce_agent.sources.src_tail.headers.f_ecommerce.headerKey1 = ecommerce_stream

# Replicating Channel Selector (Fan-out: duplica os eventos para ambos os canais)
ecommerce_agent.sources.src_tail.selector.type = replicating
ecommerce_agent.sources.src_tail.channels = c_hdfs c_flink

# ------------------------------------------------------------------------------
# 2. Configuração dos Canais (Memory Channels)
# ------------------------------------------------------------------------------
# Canal 1: Buffer para HDFS
ecommerce_agent.channels.c_hdfs.type = memory
ecommerce_agent.channels.c_hdfs.capacity = 10000
ecommerce_agent.channels.c_hdfs.transactionCapacity = 1000

# Canal 2: Buffer para Flink (Streaming)
ecommerce_agent.channels.c_flink.type = memory
ecommerce_agent.channels.c_flink.capacity = 10000
ecommerce_agent.channels.c_flink.transactionCapacity = 1000

# ------------------------------------------------------------------------------
# 3. Sink 1: HDFS (Logs Brutos para Camada Batch / Spark / Hive)
# ------------------------------------------------------------------------------
ecommerce_agent.sinks.sink_hdfs.type = hdfs
ecommerce_agent.sinks.sink_hdfs.channel = c_hdfs
ecommerce_agent.sinks.sink_hdfs.hdfs.path = hdfs://namenode:8020/raw/ecommerce/year=%Y/month=%m/day=%d
ecommerce_agent.sinks.sink_hdfs.hdfs.filePrefix = events
ecommerce_agent.sinks.sink_hdfs.hdfs.fileSuffix = .json
ecommerce_agent.sinks.sink_hdfs.hdfs.fileType = DataStream
ecommerce_agent.sinks.sink_hdfs.hdfs.writeFormat = Text
ecommerce_agent.sinks.sink_hdfs.hdfs.useLocalTimeStamp = true

# Políticas de Roll (rotação de arquivos no HDFS)
# Rola a cada 60 segundos ou quando atingir 10MB (RollCount = 0 para desabilitar por qtde de eventos)
ecommerce_agent.sinks.sink_hdfs.hdfs.rollInterval = 60
ecommerce_agent.sinks.sink_hdfs.hdfs.rollSize = 10485760
ecommerce_agent.sinks.sink_hdfs.hdfs.rollCount = 0
ecommerce_agent.sinks.sink_hdfs.hdfs.batchSize = 100
ecommerce_agent.sinks.sink_hdfs.hdfs.idleTimeout = 30

# ------------------------------------------------------------------------------
# 4. Sink 2: Streaming para Flink (Avro RPC ou Gateway de Streaming)
# ------------------------------------------------------------------------------
ecommerce_agent.sinks.sink_flink.type = avro
ecommerce_agent.sinks.sink_flink.channel = c_flink
ecommerce_agent.sinks.sink_flink.hostname = flink-jobmanager
ecommerce_agent.sinks.sink_flink.port = 9999
ecommerce_agent.sinks.sink_flink.batch-size = 50
